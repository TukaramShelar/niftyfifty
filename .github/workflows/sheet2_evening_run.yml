name: Evening Sheet2 Nifty OHLC Fetcher

on:
  schedule:
    # 8:00 PM IST (14:30 UTC) - Monday through Friday
    - cron: '30 14 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests gspread google-auth yfinance

    - name: Execute Evening Sheet2 Script
      env:
        GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        SPREADSHEET_NAME: "NiftyDailyData"
      run: python sheet2_nifty_ohlc.py
